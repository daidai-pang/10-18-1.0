罰"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1369, "num": 15, "answer": "1", "question": "受僱人於職務上所完成之發明、新型或設計，其專利申請權及專利權如未 特別約定屬於下列何者？", "choices": ["雇用人", "受僱人", "雇用人所指定之自然人或 法人", "雇用人與受僱人共有"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1370, "num": 16, "answer": "4", "question": "任職大發公司的郝聰明，專門從事技術研發，有關研發技術的專利申請權 及專利權歸屬，下列敘述何者錯誤？", "choices": ["職務上所完成的發明，除契約另有 約定外，專利申請權及專利權屬於大發公司", "職務上所完成的發明，雖然 專利申請權及專利權屬於大發公司，但是郝聰明享有姓名表示權", "郝聰明 完成非職務上的發明，應即以書面通知大發公司", "大發公司與郝聰明之雇 傭契約約定，郝聰明非職務上的發明，全部屬於公司，約定有效"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1371, "num": 17, "answer": "3", "question": "有關著作權的敘述，下列何者錯誤？", "choices": ["我們到表演場所觀看表演時，不可 隨便錄音或錄影", "到攝影展上，拿相機拍攝展示的作品，分贈給朋友，是 侵害著作權的行為", "網路上供人下載的免費軟體，都不受著作權法保護， 所以我可以燒成大補帖光碟，再去賣給別人", "高普考試題，不受著作權法 保護"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1372, "num": 18, "answer": "3", "question": "有關著作權的敘述，下列何者錯誤？", "choices": ["撰寫碩博士論文時，在合理範圍內 引用他人的著作，只要註明出處，不會構成侵害著作權", "在網路散布盜版 光碟，不管有沒有營利，會構成侵害著作權", "在網路的部落格看到一篇文 章很棒，只要註明出處，就可以把文章複製在自己的部落格", "將補習班老 師的上課內容錄音檔，放到網路上拍賣，會構成侵害著作權"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1373, "num": 19, "answer": "4", "question": "有關商標權的敘述，下列何者錯誤？", "choices": ["要取得商標權一定要申請商標註冊", "商標註冊後可取得10 年商標權", "商標註冊後，3 年不使用，會被廢止 商標權", "在夜市買的仿冒品，品質不好，上網拍賣，不會構成侵權"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1374, "num": 20, "answer": "1", "question": "有關營業秘密的敘述，下列何者錯誤？", "choices": ["受雇人於非職務上研究或開發之 營業秘密，仍歸雇用人所有", "營業秘密不得為質權及強制執行之標的", "營業秘密所有人得授權他人使用其營業秘密", "營業秘密得全部或部分讓與 他人或與他人共有"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1375, "num": 21, "answer": "1", "question": "甲公司將其新開發受營業秘密法保護之技術，授權乙公司使用，下列何者 錯誤？", "choices": ["乙公司已獲授權，所以可以未經甲公司同意，再授權丙公司使用", "約定授權使用限於一定之地域、時間", "約定授權使用限於特定之內容、 一定之使用方法", "要求被授權人乙公司在一定期間負有保密義務"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1376, "num": 22, "answer": "3", "question": "甲公司嚴格保密之最新配方產品大賣，下列何者侵害甲公司之營業秘密？", "choices": ["鑑定人A 因司法審理而知悉配方", "甲公司授權乙公司使用其配方", "甲 公司之B 員工擅自將配方盜賣給乙公司", "甲公司與乙公司協議共有配 方"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1377, "num": 23, "answer": "3", "question": "故意侵害他人之營業秘密，法院因被害人之請求，最高得酌定損害額幾倍 之賠償？", "choices": ["1 倍", "2 倍", "3 倍", "4 倍"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1378, "num": 24, "answer": "4", "question": "受雇者因承辦業務而知悉營業秘密，在離職後對於該營業秘密的處理方 式，下列敘述何者正確？", "choices": ["聘雇關係解除後便不再負有保障營業秘密之責", "僅能自用而不得販售獲取利益", "自離職日起3 年後便不再負有保障營業 秘密之責", "離職後仍不得洩漏該營業秘密"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1379, "num": 25, "answer": "3", "question": "按照現行法律規定，侵害他人營業秘密，其法律責任為", "choices": ["僅需負刑事責任", "僅需負民事損害賠償責任", "刑事責任與民事損害賠償責任皆須負擔", "刑事責任與民事損害賠償責任皆不須負擔"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1380, "num": 26, "answer": "3", "question": "企業內部之營業秘密，可以概分為「商業性營業秘密」及「技術性營業秘 密」二大類型，請問下列何者屬於「技術性營業秘密」？", "choices": ["人事管理", "經銷據點", "產品配方", "客戶名單"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1381, "num": 27, "answer": "3", "question": "某離職同事請求在職員工將離職前所製作之某份文件傳送給他，請問下列 回應方式何者正確？", "choices": ["由於該項文件係由該離職員工製作，因此可以傳送 文件", "若其目的僅為保留檔案備份，便可以傳送文件", "可能構成對於營 業秘密之侵害，應予拒絕並請他直接向公司提出請求", "視彼此交情決定是 否傳送文件"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1382, "num": 28, "answer": "1", "question": "行為人以竊取等不正當方法取得營業秘密，下列敘述何者正確？", "choices": ["已構成 犯罪", "只要後續沒有洩漏便不構成犯罪", "只要後續沒有出現使用之行為 便不構成犯罪", "只要後續沒有造成所有人之損害便不構成犯罪"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1383, "num": 29, "answer": "3", "question": "針對在我國境內竊取營業秘密後，意圖在外國、中國大陸或港澳地區使用 者，營業秘密法是否可以適用？", "choices": ["無法適用", "可以適用，但若屬未遂犯 則不罰", "可以適用並加重其刑", "能否適用需視該國家或地區與我國是否 簽訂相互保護營業秘密之條約或協定"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1384, "num": 30, "answer": "4", "question": "所謂營業秘密，係指方法、技術、製程、配方、程式、設計或其他可用於 生產、銷售或經營之資訊，但其保障所需符合的要件不包括下列何者？", "choices": ["因其秘密性而具有實際之經濟價值者", "所有人已採取合理之保密措施者", "因其秘密性而具有潛在之經濟價值者", "一般涉及該類資訊之人所知 者"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1385, "num": 31, "answer": "1", "question": "因故意或過失而不法侵害他人之營業秘密者，負損害賠償責任該損害賠償 之請求權，自請求權人知有行為及賠償義務人時起，幾年間不行使就會消 滅？", "choices": ["2 年", "5 年", "7 年", "10 年"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1386, "num": 32, "answer": "1", "question": "公司負責人為了要節省開銷，將員工薪資以高報低來投保全民健保及勞 保，是觸犯了刑法上之何種罪刑？", "choices": ["詐欺罪", "侵占罪", "背信罪", "工商秘 密罪"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1387, "num": 33, "answer": "2", "question": "A 受僱於公司擔任會計，因自己的財務陷入危機，多次將公司帳款轉入妻 兒戶頭，是觸犯了刑法上之何種罪刑？", "choices": ["洩漏工商秘密罪", "侵占罪", "詐 欺罪", "偽造文書罪"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1388, "num": 34, "answer": "3", "question": "某甲於公司擔任業務經理時，未依規定經董事會同意，私自與自己親友之 公司訂定生意合約，會觸犯下列何種罪刑？", "choices": ["侵占罪", "貪污罪", "背信罪", "詐欺罪"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1389, "num": 35, "answer": "1", "question": "如果你擔任公司採購的職務，親朋好友們會向你推銷自家的產品，希望你 要採購時，你應該", "choices": ["適時地婉拒，說明利益需要迴避的考量，請他們見諒", "既然是親朋好友，就應該互相幫忙", "建議親朋好友將產品折扣，折扣部 分歸於自己，就會採購", "可以暗中地幫忙親朋好友，進行採購，不要被發 現有親友關係便可"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1390, "num": 36, "answer": "3", "question": "小美是公司的業務經理，有一天巧遇國中同班的死黨小林，發現他是公司 的下游廠商老闆。最近小美處理一件公司的招標案件，小林的公司也在其 中，私下約小美見面，請求她提供這次招標案的底標，並馬上要給予幾十 萬元的前謝金，請問小美該怎麼辦？", "choices": ["退回錢，並告訴小林都是老朋友， 一定會全力幫忙", "收下錢，將錢拿出來給單位同事們分紅", "應該堅決拒 絕，並避免每次見面都與小林談論相關業務問題", "朋友一場，給他一個比 較接近底標的金額，反正又不是正確的，所以沒關係"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1391, "num": 37, "answer": "3", "question": "公司發給每人一台平板電腦提供業務上使用，但是發現根本很少在使用， 為了讓它有效的利用，所以將它拿回家給親人使用，這樣的行為是", "choices": ["可以 的，這樣就不用花錢買", "可以的，反正放在那裡不用它，也是浪費資源", "不可以的，因為這是公司的財產，不能私用", "不可以的，因為使用年限 未到，如果年限到報廢了，便可以拿回家"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1392, "num": 38, "answer": "3", "question": "公司的車子，假日又沒人使用，你是鑰匙保管者，請問假日可以開出去 嗎？", "choices": ["可以，只要付費加油即可", "可以，反正假日不影響公務", "不可 以，因為是公司的，並非私人擁有", "不可以，應該是讓公司想要使用的員 工，輪流使用才可"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1393, "num": 39, "answer": "4", "question": "阿哲是財經線的新聞記者，某次採訪中得知A 公司在一個月內將有一個大 的併購案，這個併購案顯示公司的財力，且能讓A 公司股價往上飆升。請 問阿哲得知此消息後，可以立刻購買該公司的股票嗎？", "choices": ["可以，有錢大家 賺", "可以，這是我努力獲得的消息", "可以，不賺白不賺", "不可以，屬於 內線消息，必須保持記者之操守，不得洩漏"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1394, "num": 40, "answer": "4", "question": "與公務機關接洽業務時，下列敘述何者正確？", "choices": ["沒有要求公務員違背職 務，花錢疏通而已，並不違法", "唆使公務機關承辦採購人員配合浮報價 額，僅屬偽造文書行為", "口頭允諾行賄金額但還沒送錢，尚不構成犯罪", "與公務員同謀之共犯，即便不具公務員身分，仍可依據貪污治罪條例處 刑"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1395, "num": 41, "answer": "1", "question": "與公務機關有業務往來構成職務利害關係者，下列敘述何者正確？", "choices": ["將餽 贈之財物請公務員父母代轉，該公務員亦已違反規定", "與公務機關承辦人 飲宴應酬為增進基本關係的必要方法", "高級茶葉低價售予有利害關係之承 辦公務員，有價購行為就不算違反法規", "機關公務員藉子女婚宴廣邀業務 往來廠商之行為，並無不妥"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1396, "num": 42, "answer": "4", "question": "廠商某甲承攬公共工程，工程進行期間，甲與其工程人員經常招待該公共 工程委辦機關之監工及驗收之公務員喝花酒或招待出國旅遊，下列敘述何 者正確？", "choices": ["公務員若沒有收現金，就沒有罪", "只要工程沒有問題，某甲 與監工及驗收等相關公務員就沒有犯罪", "因為不是送錢，所以都沒有犯罪", "某甲與相關公務員均已涉嫌觸犯貪污治罪條例"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1397, "num": 43, "answer": "1", "question": "行（受）賄罪成立要素之一為具有對價關係，而作為公務員職務之對價有 「賄賂」或「不正利益」，下列何者不屬於「賄賂」或「不正利益」？", "choices": ["開工邀請公務員觀禮", "送百貨公司大額禮券", "免除債務", "招待吃米其林 等級之高檔大餐"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1398, "num": 44, "answer": "4", "question": "下列有關貪腐的敘述何者錯誤？", "choices": ["貪腐會危害永續發展和法治", "貪腐會 破壞民主體制及價值觀", "貪腐會破壞倫理道德與正義", "貪腐有助降低企 業的經營成本"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1399, "num": 45, "answer": "4", "question": "下列何者不是設置反貪腐專責機構須具備的必要條件？", "choices": ["賦予該機構必要 的獨立性", "使該機構的工作人員行使職權不會受到不當干預", "提供該機 構必要的資源、專職工作人員及必要培訓", "賦予該機構的工作人員有權力 可隨時逮捕貪污嫌疑人"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1400, "num": 46, "answer": "2", "question": "檢舉人向有偵查權機關或政風機構檢舉貪污瀆職，必須於何時為之始可能 給與獎金？", "choices": ["犯罪未起訴前", "犯罪未發覺前", "犯罪未遂前", "預備犯罪 前"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1401, "num": 47, "answer": "3", "question": "檢舉人應以何種方式檢舉貪污瀆職始能核給獎金？", "choices": ["匿名", "委託他人檢 舉", "以真實姓名檢舉", "以他人名義檢舉"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1402, "num": 48, "answer": "4", "question": "我國制定何種法律以保護刑事案件之證人，使其勇於出面作證，俾利犯罪 之偵查、審判？", "choices": ["貪污治罪條例", "刑事訴訟法", "行政程序法", "證人保護 法"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1403, "num": 49, "answer": "1", "question": "下列何者非屬公司對於企業社會責任實踐之原則？", "choices": ["加強個人資料揭露", "維護社會公益", "發展永續環境", "落實公司治理"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1404, "num": 50, "answer": "1", "question": "下列何者並不屬於「職業素養」規範中的範疇？", "choices": ["增進自我獲利的能力", "擁有正確的職業價值觀", "積極進取職業的知識技能", "具備良好的職業 行為習慣"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1405, "num": 51, "answer": "4", "question": "下列何者符合專業人員的職業道德？", "choices": ["未經雇主同意，於上班時間從事私 人事務", "利用雇主的機具設備私自接單生產", "未經顧客同意，任意散佈 或利用顧客資料", "盡力維護雇主及客戶的權益"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1406, "num": 52, "answer": "4", "question": "身為公司員工必須維護公司利益，下列何者是正確的工作態度或行為？", "choices": ["將公司逾期的產品更改標籤", "施工時以省時、省料為獲利首要考量，不顧 品質", "服務時優先考量公司的利益，顧客權益次之", "工作時謹守本分， 以積極態度解決問題"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1407, "num": 53, "answer": "3", "question": "身為專業技術工作人士，應以何種認知及態度服務客戶？", "choices": ["若客戶不瞭 解，就儘量減少成本支出，抬高報價", "遇到維修問題，儘量拖過保固期", "主動告知可能碰到問題及預防方法", "隨著個人心情來提供服務的內容及 品質"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1408, "num": 54, "answer": "2", "question": "因為工作本身需要高度專業技術及知識，所以在對客戶服務時應如何？", "choices": ["不用理會顧客的意見", "保持親切、真誠、客戶至上的態度", "若價錢較 低，就敷衍了事", "以專業機密為由，不用對客戶說明及解釋"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1409, "num": 55, "answer": "2", "question": "從事專業性工作，在與客戶約定時間應", "choices": ["保持彈性，任意調整", "儘可能 準時，依約定時間完成工作", "能拖就拖，能改就改", "自己方便就好，不 必理會客戶的要求"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1410, "num": 56, "answer": "1", "question": "從事專業性工作，在服務顧客時應有的態度為何？", "choices": ["選擇最安全、經濟及 有效的方法完成工作", "選擇工時較長、獲利較多的方法服務客戶", "為了 降低成本，可以降低安全標準", "不必顧及雇主和顧客的立場"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1411, "num": 57, "answer": "4", "question": "以下哪一項員工的作為符合敬業精神？", "choices": ["利用正常工作時間從事私人事務", "運用雇主的資源，從事個人工作", "未經雇主同意擅離工作崗位", "謹守 職場紀律及禮節，尊重客戶隱私"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1412, "num": 58, "answer": "3", "question": "小張獲選為小孩學校的家長會長，這個月要召開會議，沒時間準備資料， 所以，利用上班期間有空檔非休息時間來完成，請問是否可以？", "choices": ["可以， 因為不耽誤他的工作", "可以，因為他能力好，能夠同時完成很多事", "不 可以，因為這是私事，不可以利用上班時間完成", "可以，只要不要被發 現"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1413, "num": 59, "answer": "2", "question": "小吳是公司的專用司機，為了能夠隨時用車，經過公司同意，每晚都將公 司的車開回家，然而，他發現反正每天上班路線，都要經過女兒學校，就 順便載女兒上學，請問可以嗎？", "choices": ["可以，反正順路", "不可以，這是公司 的車不能私用", "可以，只要不被公司發現即可", "可以，要資源須有效使 用"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1414, "num": 60, "answer": "4", "question": "小江是職場上的新鮮人，剛進公司不久，他應該具備怎樣的態度？", "choices": ["上 班、下班，管好自己便可", "仔細觀察公司生態，加入某些小團體，以做為 後盾", "只要做好人脈關係，這樣以後就好辦事", "努力做好自己職掌的業 務，樂於工作，與同事之間有良好的互動，相互協助"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1415, "num": 61, "answer": "4", "question": "在公司內部行使商務禮儀的過程，主要以參與者在公司中的何種條件來訂 定順序？", "choices": ["年齡", "性別", "社會地位", "職位"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1416, "num": 62, "answer": "1", "question": "一位職場新鮮人剛進公司時，良好的工作態度是", "choices": ["多觀察、多學習，了解 企業文化和價值觀", "多打聽哪一個部門比較輕鬆，升遷機會較多", "多探 聽哪一個公司在找人，隨時準備跳槽走人", "多遊走各部門認識同事，建立 自己的小圈圈"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1417, "num": 63, "answer": "1", "question": "根據消除對婦女一切形式歧視公約(CEDAW)，下列何者正確？", "choices": ["對婦女 的歧視指基於性別而作的任何區別、排斥或限制", "只關心女性在政治方面 的人權和基本自由", "未要求政府需消除個人或企業對女性的歧視", "傳統 習俗應予保護及傳承，即使含有歧視女性的部分，也不可以改變"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1418, "num": 64, "answer": "1", "question": "某規範明定地政機關進用女性測量助理名額，不得超過該機關測量助理名 額總數二分之一，根據消除對婦女一切形式歧視公約(CEDAW)，下列何者 正確？", "choices": ["限制女性測量助理人數比例，屬於直接歧視", "土地測量經常在 戶外工作，基於保護女性所作的限制，不屬性別歧視", "此項二分之一規定 是為促進男女比例平衡", "此限制是為確保機關業務順暢推動，並未歧視女 性"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1419, "num": 65, "answer": "4", "question": "根據消除對婦女一切形式歧視公約(CEDAW)之間接歧視意涵，下列何者錯 誤？", "choices": ["一項法律、政策、方案或措施表面上對男性和女性無任何歧視，但 實際上卻產生歧視女性的效果", "察覺間接歧視的一個方法，是善加利用性 別統計與性別分析", "如果未正視歧視之結構和歷史模式，及忽略男女權力 關係之不平等，可能使現有不平等狀況更為惡化", "不論在任何情況下，只 要以相同方式對待男性和女性，就能避免間接歧視之產生"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1420, "num": 66, "answer": "4", "question": "下列何者不是菸害防制法之立法目的？", "choices": ["防制菸害", "保護未成年免於菸 害", "保護孕婦免於菸害", "促進菸品的使用"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1421, "num": 67, "answer": "1", "question": "按菸害防制法規定，在禁菸場所吸菸會被罰多少錢？", "choices": ["新臺幣2 千元至1 萬元罰鍰", "新臺幣1 千元至5 千元罰鍰", "新臺幣1 萬元至5 萬元罰鍰", "新臺幣2 萬元至10 萬元罰鍰"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1422, "num": 68, "answer": "3", "question": "請問下列何者不是個人資料保護法所定義的個人資料？", "choices": ["身分證號碼", "最高學歷", "職稱", "護照號碼"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1423, "num": 69, "answer": "1", "question": "有關專利權的敘述，下列何者正確？", "choices": ["專利有規定保護年限，當某商品、 技術的專利保護年限屆滿，任何人皆可免費運用該項專利", "我發明了某項 商品，卻被他人率先申請專利權，我仍可主張擁有這項商品的專利權", "製 造方法可以申請新型專利權", "在本國申請專利之商品進軍國外，不需向他 國申請專利權"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1424, "num": 70, "answer": "4", "question": "下列何者行為會有侵害著作權的問題？", "choices": ["將報導事件事實的新聞文字轉貼 於自己的社群網站", "直接轉貼高普考考古題在FACEBOOK", "以分享網址 的方式轉貼資訊分享於社群網站", "將講師的授課內容錄音，複製多份分贈 友人"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1425, "num": 71, "answer": "1", "question": "有關著作權之概念，下列何者正確？", "choices": ["國外學者之著作，可受我國著作權 法的保護", "公務機關所函頒之公文，受我國著作權法的保護", "著作權要 待向智慧財產權申請通過後才可主張", "以傳達事實之新聞報導的語文著 作，依然受著作權之保障"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1426, "num": 72, "answer": "1", "question": "某廠商之商標在我國已經獲准註冊，請問若希望將商品行銷販賣到國外， 請問是否需在當地申請註冊才能主張商標權？", "choices": ["是，因為商標權註冊採取 屬地保護原則", "否，因為我國申請註冊之商標權在國外也會受到承認", "不一定，需視我國是否與商品希望行銷販賣的國家訂有相互商標承認之協 定", "不一定，需視商品希望行銷販賣的國家是否為WTO 會員國"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1427, "num": 73, "answer": "1", "question": "下列何者不屬於營業秘密？", "choices": ["具廣告性質的不動產交易底價", "須授權取 得之產品設計或開發流程圖示", "公司內部管制的各種計畫方案", "不是公 開可查知的客戶名單分析資料"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1428, "num": 74, "answer": "3", "question": "營業秘密可分為「技術機密」與「商業機密」，下列何者屬於「商業機 密」？", "choices": ["程式", "設計圖", "商業策略", "生產製程"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1429, "num": 75, "answer": "3", "question": "某甲在公務機關擔任首長，其弟弟乙是某協會的理事長，乙為舉辦協會活 動，決定向甲服務的機關申請經費補助，下列有關利益衝突迴避之敘述， 何者正確？", "choices": ["協會是舉辦慈善活動，甲認為是好事，所以指示機關承辦人 補助活動經費", "機關未經公開公平方式，私下直接對協會補助活動經費新 臺幣10 萬元", "甲應自行迴避該案審查，避免瓜田李下，防止利益衝突", "乙為順利取得補助，應該隱瞞是機關首長甲之弟弟的身分"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1430, "num": 76, "answer": "3", "question": "依公職人員利益衝突迴避法規定，公職人員甲與其小舅子乙（二親等以內 的關係人）間，下列何種行為不違反該法？", "choices": ["甲要求受其監督之機關聘用 小舅子乙", "小舅子乙以請託關說之方式，請求甲之服務機關通過其名下農 地變更使用申請案", "關係人乙經政府採購法公開招標程序，並主動在投標 文件表明與甲的身分關係，取得甲服務機關之年度採購標案", "甲、乙兩人 均自認為人公正，處事坦蕩，任何往來都是清者自清，不需擔心任何問 題"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1431, "num": 77, "answer": "3", "question": "大雄擔任公司部門主管，代表公司向公務機關投標，為使公司順利取得標 案，可以向公務機關的採購人員為以下何種行為？", "choices": ["為社交禮俗需要，贈 送價值昂貴的名牌手錶作為見面禮", "為與公務機關間有良好互動，招待至 有女陪侍場所飲宴", "為了解招標文件內容，提出招標文件疑義並請說明", "為避免報價錯誤，要求提供底價作為參考"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1432, "num": 78, "answer": "1", "question": "下列關於政府採購人員之敘述，何者未違反相關規定？", "choices": ["非主動向廠商求 取，是偶發地收到廠商致贈價值在新臺幣500 元以下之廣告物、促銷品、 紀念品", "要求廠商提供與採購無關之額外服務", "利用職務關係向廠商借 貸", "利用職務關係媒介親友至廠商處所任職"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1433, "num": 79, "answer": "4", "question": "下列敘述何者錯誤？", "choices": ["憲法保障言論自由，但散布假新聞、假消息仍須面 對法律責任", "在網路或Line 社群網站收到假訊息，可以敘明案情並附加 截圖檔，向法務部調查局檢舉", "對新聞媒體報導有意見，向國家通訊傳播 委員會申訴", "自己或他人捏造、扭曲、竄改或虛構的訊息，只要一小部分 能證明是真的，就不會構成假訊息"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1434, "num": 80, "answer": "4", "question": "下列敘述何者正確？", "choices": ["公務機關委託的代檢（代驗）業者，不是公務員， 不會觸犯到刑法的罪責", "賄賂或不正利益，只限於法定貨幣，給予網路遊 戲幣沒有違法的問題", "在靠北公務員社群網站，覺得可受公評且匿名發 文，就可以謾罵公務機關對特定案件的檢查情形", "受公務機關委託辦理案 件，除履行採購契約應辦事項外，對於蒐集到的個人資料，也要遵守相關 保護及保密規定"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1435, "num": 81, "answer": "1", "question": "有關促進參與及預防貪腐的敘述，下列何者錯誤？", "choices": ["我國非聯合國會員 國，無須落實聯合國反貪腐公約規定", "推動政府部門以外之個人及團體積 極參與預防和打擊貪腐", "提高決策過程之透明度，並促進公眾在決策過程 中發揮作用", "對公職人員訂定執行公務之行為守則或標準"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1436, "num": 82, "answer": "2", "question": "為建立良好之公司治理制度，公司內部宜納入何種檢舉人制度？", "choices": ["告訴乃 論制度", "吹哨者（whistleblower）保護程序及保護制度", "不告不理制度", "非告訴乃論制度"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1437, "num": 83, "answer": "4", "question": "有關公司訂定誠信經營守則時，下列何者錯誤？", "choices": ["避免與涉有不誠信行為 者進行交易", "防範侵害營業秘密、商標權、專利權、著作權及其他智慧財 產權", "建立有效之會計制度及內部控制制度", "防範檢舉"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1438, "num": 84, "answer": "1", "question": "乘坐轎車時，如有司機駕駛，按照國際乘車禮儀，以司機的方位來看，首 位應為", "choices": ["後排右側", "前座右側", "後排左側", "後排中間"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1439, "num": 85, "answer": "2", "question": "今天好友突然來電，想來個「說走就走的旅行」，因此，無法去上班，下 列何者作法不適當？", "choices": ["發送E-MAIL 給主管與人事部門，並收到回覆", "什麼都無需做，等公司打電話來確認後，再告知即可", "用LINE 傳訊息給 主管，並確認讀取且有回覆", "打電話給主管與人事部門請假"], "section": "工作項目01：工作倫理與職業道德"}, {"id": 1440, "num": 86, "answer": "4", "question": "每天下班回家後，就懶得再出門去買菜，利用上班時間瀏覽線上購物網 站，發現有很多限時搶購的便宜商品，還能在下班前就可以送到公司，下 班順便帶回家，省掉好多時間，下列何者最適當？", "choices": ["可以，又沒離開工作 崗位，且能節省時間", "可以，還能介紹同事一同團購，省更多的錢，增進 同事情誼", "不可以，應該把商品寄回家，不是公司", "不可以，上班不能 從事個人私務，應該等下班後再網路 $('options').innerHTML='';
let choices=current.choices||[];
if(!choices.length){choices=['①','②','③','④'];}
choices.forEach((txt,i)=>{let lab=document.createElement('label');lab.className='option';let inp=document.createElement('input');inp.type=multi?'checkbox':'radio';inp.name='answer';inp.value=String(i+1);let span=document.createElement('span');span.textContent=`${'①②③④⑤⑥'[i]||i+1} ${txt}`;lab.append(inp,span);$('options').appendChild(lab)});
$('hint').textContent=multi?'🟧 複選題：請勾選所有正確答案；必須全部選對才算答對。':'🟦 單選題：選一個答案即可。';
}
function openEditor(q=current){if(!q)return; $('editQuestion').value=q.question||''; $('editAnswer').value=q.answer||''; $('editChoices').innerHTML=''; (q.choices||[]).forEach((choice,i)=>{let label=document.createElement('label');label.textContent=`選項 ${i+1}`;let input=document.createElement('input');input.value=choice;input.dataset.index=i;input.style.width='100%';input.style.boxSizing='border-box';label.appendChild(input);$('editChoices').appendChild(label)});$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'});}
function closeEditor(){$('editor').classList.add('hidden')}
function saveEdit(){if(!current)return;let q=QUESTIONS.find(x=>x.id===current.id);let question=$('editQuestion').value.trim();let choices=[...$('editChoices').querySelectorAll('input')].map(x=>x.value.trim());let answer=$('editAnswer').value.trim();if(!question){alert('題目內容不能空白');return}if(choices.some(x=>!x)){alert('每個選項都要填寫');return}if(!/^[1-6]+$/.test(answer)||[...new Set(answer)].length!==answer.length||[...answer].some(n=>Number(n)>choices.length)){alert('正確答案請填有效選項編號，例如單選 2、複選 134；不要重複編號。');return}q.question=question;q.choices=choices;q.answer=[...answer].sort().join('');edits[q.id]={question:q.question,choices:q.choices,answer:q.answer};try{localStorage.setItem(EDIT_KEY,JSON.stringify(edits))}catch(e){alert('儲存失敗，可能是瀏覽器儲存空間或權限問題。');return}current=q;closeEditor();show();alert('修改已儲存！');}
function submit(){if(locked||!current)return;let selected=[...document.querySelectorAll('#options input:checked')].map(x=>x.value).sort().join('');if(!selected){$('feedback').className='feedback bad';$('feedback').textContent='請先選擇答案。';return}
let correct=selected===current.answer.split('').sort().join('');let s=st(current);if(correct)s.right++;else s.wrong++;stats[current.id]=s;save();locked=true;
document.querySelectorAll('#options input').forEach(x=>{x.disabled=true;let lab=x.closest('.option');if(current.answer.includes(x.value))lab.style.borderColor='#16a34a';if(x.checked&&!current.answer.includes(x.value))lab.style.borderColor='#dc2626'});
$('feedback').className='feedback '+(correct?'good':'bad');$('feedback').textContent=(correct?'答對！':'答錯。')+` 正確答案：${[...current.answer].map(n=>'①②③④⑤⑥'[Number(n)-1]||n).join('、')}。此題累計答對 ${s.right} 次、答錯 ${s.wrong} 次。`;
$('submit').disabled=true;$('next').disabled=false;
}
function next(){if(pos+1>=queue.length){$('qtext').textContent='本輪題目已完成！可切換「錯題複習」或重新開始。';$('options').innerHTML='';$('counter').textContent=`完成 ${queue.length} 題`;$('feedback').className='feedback good';$('feedback').textContent='本輪完成。你的作答統計已自動儲存。';$('submit').disabled=true;$('next').disabled=true;return}pos++;show()}
$('start').onclick=start;$('submit').onclick=submit;$('editBtn').onclick=()=>openEditor(current);$('saveEdit').onclick=saveEdit;$('cancelEdit').onclick=closeEditor;$('next').onclick=next;$('skip').onclick=()=>{if(queue.length)next()};
$('statsBtn').onclick=()=>{renderStats();$('statistics').classList.remove('hidden');$('quiz').classList.add('hidden')};
$('back').onclick=()=>{$('statistics').classList.add('hidden');$('quiz').classList.remove('hidden')};
$('search').oninput=renderStats;
function renderStats(){let term=$('search').value.toLowerCase();let rows=QUESTIONS.filter(q=>(q.question+' '+q.section+' '+q.num).toLowerCase().includes(term)).map(q=>({q,s:st(q)})).filter(x=>x.s.right+x.s.wrong>0||term).sort((a,b)=>b.s.wrong-a.s.wrong||a.q.id-b.q.id);
$('statRows').innerHTML='';rows.forEach(({q,s})=>{let tr=document.createElement('tr');let rate=s.right+s.wrong?Math.round(s.right/(s.right+s.wrong)*100)+'%':'—';[`${q.id}（原題 ${q.num}）`,q.question,s.right,s.wrong,rate].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.appendChild(td)});let td=document.createElement('td'),b=document.createElement('button');b.textContent='練這題';b.onclick=()=>{queue=[q];pos=0;$('statistics').classList.add('hidden');$('quiz').classList.remove('hidden');$('submit').disabled=false;show()};let eb=document.createElement('button');eb.textContent='編輯';eb.style.marginLeft='5px';eb.onclick=()=>{queue=[q];pos=0;current=q;$('statistics').classList.add('hidden');$('quiz').classList.remove('hidden');show();openEditor(q)};td.append(b,eb);tr.appendChild(td);$('statRows').appendChild(tr)})}
$('reset').onclick=()=>{if(confirm('確定清除所有答對／答錯統計？此操作無法復原。')){stats={};save();if(!$('statistics').classList.contains('hidden'))renderStats()}};
updateStats();start();
</script></body></html>
